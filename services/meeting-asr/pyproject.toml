[project]
name = "meeting-asr"
version = "0.1.0"
description = "Authenticated loopback ASR sidecar for Meeting Agent meetings"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
funasr = [
    "funasr==1.4.12",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
]
voice = [
    "onnxruntime==1.29.0",
    "sherpa-onnx==1.13.7",
]
qwen = [
    "qwen-asr==0.0.6",
    "torch==2.10.0",
    "torchaudio==2.10.0",
]

[project.scripts]
meeting-asr = "meeting_asr.__main__:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=9,<10",
]
lint = [
  "ruff>=0.15,<1",
]
package = [
  "pyinstaller==6.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
