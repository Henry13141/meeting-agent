[project]
name = "meeting-runtime"
version = "0.1.0"
description = "Meeting assistant with opt-in MCP tools and skill workflows"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic>=2.12,<3", "uvicorn>=0.41,<1", "mcp==2.3.0", "httpx2>=2.12,<3", "PyYAML>=6,<7", "jsonschema>=4.25,<5"]

[project.scripts]
meeting-runtime = "meeting_runtime.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
