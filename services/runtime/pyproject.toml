[project]
name = "meeting-runtime"
version = "0.1.0"
description = "Text-only meeting question answering and summaries"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic>=2.12,<3", "uvicorn>=0.41,<1"]

[project.scripts]
meeting-runtime = "meeting_runtime.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
